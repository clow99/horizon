name: CI Build and Publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image from the lockfile
        env:
          SOURCE_REVISION: ${{ gitea.sha }}
        run: docker build --pull --label "org.opencontainers.image.revision=$SOURCE_REVISION" --tag horizon:latest .

      - name: Tag Docker image (live)
        run: docker tag horizon:latest localhost:5000/horizon:live

      - name: Push Docker image (live)
        run: docker push localhost:5000/horizon:live
