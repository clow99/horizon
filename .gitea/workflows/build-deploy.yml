name: CI Build and Deploy

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: List .next build output
              run: ls -la .next || true

            - name: Install Docker and Docker Compose
              run: |
                  sudo apt update
                  sudo apt install -y docker-compose

            - name: Check Docker and Compose versions
              run: |
                  docker --version
                  docker-compose --version

            - name: Build Docker image with docker-compose
              run: docker-compose build

            - name: List Docker images
              run: docker images

            - name: Tag Docker image (live)
              run: docker tag horizon:latest localhost:5000/horizon:live

            - name: Push Docker image (live)
              run: docker push localhost:5000/horizon:live
